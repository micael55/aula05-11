<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .descricao {
            color: #777;
            margin-bottom: 25px;
        }

        .campo {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        #resultado {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>

        <p class="descricao">
            Descubra seu Índice de Massa Corporal!
        </p>

        <form id="formulario">

            <div class="campo">
                <label for="peso">Peso (kg)</label>
                <input
                    type="number"
                    id="peso"
                    placeholder="Ex: 70"
                    step="any"
                    min="0"
                    required
                >
            </div>

            <div class="campo">
                <label for="altura">Altura (m)</label>
                <input
                    type="number"
                    id="altura"
                    placeholder="Ex: 1.75"
                    step="any"
                    min="0"
                    required
                >
            </div>

            <button type="submit">Calcular IMC</button>

        </form>

        <p id="resultado"></p>

    </div>

    <script>
        const formulario = document.getElementById("formulario");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            // Obtendo os valores dos campos
            const peso = parseFloat(
                document.getElementById("peso").value
            );

            const altura = parseFloat(
                document.getElementById("altura").value
            );

            // Verificando os valores
            if (peso <= 0 || altura <= 0 ||
                !Number.isFinite(peso) ||
                !Number.isFinite(altura)) {

                document.getElementById("resultado").textContent =
                    "Digite valores válidos!";

                return;
            }

            // Calculando o IMC
            const imc = peso / (altura * altura);

            // Exibindo o resultado
            document.getElementById("resultado").textContent =
                "Seu IMC é: " + imc.toFixed(1);

        });
    </script>

</body>
</html>
